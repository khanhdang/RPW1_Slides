<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc"><title id="title">Conferences and journals</title><desc id="desc">Diagram labels: Conference. Often a fixed deadline. Scheduled event. Event-based review stages. Journal. Often year-round submission. Published in a journal. May have revision rounds. Page limits, review time, and procedures vary..</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#77756d" stroke-width="2" /></marker></defs><g font-family="Aptos, Segoe UI, Arial, sans-serif"><path d="M550 35 V340" fill="none" stroke="#c9c5b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(270 85) scale(1)" fill="none" stroke="#77756d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="33" /><path d="M0-20 V0 L18 12" /></g><text x="270" y="161" fill="#77756d" font-size="31" text-anchor="middle" font-weight="700">Conference</text><text x="270" y="208" fill="#30302b" font-size="27" text-anchor="middle">Often a fixed deadline</text><text x="270" y="248" fill="#30302b" font-size="27" text-anchor="middle">Scheduled event</text><text x="270" y="288" fill="#30302b" font-size="27" text-anchor="middle">Event-based review stages</text><g transform="translate(830 85) scale(1)" fill="none" stroke="#b37218" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0-24 C-15-34-30-32-38-26 V31 C-22 24-12 27 0 35 C12 27 22 24 38 31 V-26 C30-32 15-34 0-24 V35" /></g><text x="830" y="161" fill="#b37218" font-size="31" text-anchor="middle" font-weight="700">Journal</text><text x="830" y="208" fill="#30302b" font-size="27" text-anchor="middle">Often year-round submission</text><text x="830" y="248" fill="#30302b" font-size="27" text-anchor="middle">Published in a journal</text><text x="830" y="288" fill="#30302b" font-size="27" text-anchor="middle">May have revision rounds</text><text x="550" y="385" fill="#466e7b" font-size="25" text-anchor="middle">Page limits, review time, and procedures vary.</text></g></svg>