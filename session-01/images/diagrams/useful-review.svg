<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc"><title id="title">A useful review</title><desc id="desc">Diagram labels: Vague feedback. “The experiments. are weak.”. Useful feedback. “Test a second workload. to show whether the result. applies more widely.”.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#77756d" stroke-width="2" /></marker></defs><g font-family="Aptos, Segoe UI, Arial, sans-serif"><path d="M550 35 V340" fill="none" stroke="#c9c5b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(270 85) scale(1)" fill="none" stroke="#77756d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-35-26 H35 V22 H-6 L-26 37 V22 H-35 Z M-21-9 H21 M-21 7 H11" /></g><text x="270" y="161" fill="#77756d" font-size="31" text-anchor="middle" font-weight="700">Vague feedback</text><text x="270" y="208" fill="#30302b" font-size="27" text-anchor="middle">“The experiments</text><text x="270" y="248" fill="#30302b" font-size="27" text-anchor="middle">are weak.”</text><g transform="translate(830 85) scale(1)" fill="none" stroke="#b37218" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="-6" cy="-6" r="24" /><path d="M12 12 L34 34" /></g><text x="830" y="161" fill="#b37218" font-size="31" text-anchor="middle" font-weight="700">Useful feedback</text><text x="830" y="208" fill="#30302b" font-size="27" text-anchor="middle">“Test a second workload</text><text x="830" y="248" fill="#30302b" font-size="27" text-anchor="middle">to show whether the result</text><text x="830" y="288" fill="#30302b" font-size="27" text-anchor="middle">applies more widely.”</text></g></svg>