<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc"><title id="title">Midterm and final assignment review flow</title><desc id="desc">An individual first draft receives separate reviews from three students at midterm. The author addresses every concern in the final draft. Three students review the final draft. Instructors grade both drafts and reviews.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#77756d" stroke-width="2"/></marker></defs><g font-family="Aptos, Segoe UI, Arial, sans-serif"><text x="300" y="30" text-anchor="middle" font-size="26" fill="#466e7b" font-weight="700">Midterm: 3 student reviews</text><text x="790" y="30" text-anchor="middle" font-size="26" fill="#466e7b" font-weight="700">Final: 3 student reviews</text><g transform="translate(85 190)" fill="none" stroke="#b37218" stroke-width="3.5" stroke-linejoin="round"><path d="M-28-40 H12 L31-21 V40 H-28 Z M12-40 V-21 H31 M-15-7 H17 M-15 8 H17 M-15 23 H6"/></g><text x="85" y="270" text-anchor="middle" font-size="28" fill="#b37218" font-weight="700">First draft</text><text x="85" y="307" text-anchor="middle" font-size="22" fill="#30302b">Individual paper</text><g transform="translate(545 190)" fill="none" stroke="#b37218" stroke-width="3.5" stroke-linejoin="round"><path d="M-28-40 H12 L31-21 V40 H-28 Z M12-40 V-21 H31 M-15-7 H17 M-15 8 H17 M-15 23 H6"/><circle cx="29" cy="27" r="19" fill="#f5f5f5"/><path d="M19 27 L26 34 L40 18"/></g><text x="545" y="270" text-anchor="middle" font-size="28" fill="#b37218" font-weight="700">Final draft</text><text x="545" y="307" text-anchor="middle" font-size="25" fill="#b37218" font-weight="700">Address all concerns</text><g transform="translate(300 90)" fill="none" stroke="#466e7b" stroke-width="3" stroke-linecap="round"><circle cy="-12" r="11"/><path d="M-23 22 C-23-5 23-5 23 22"/></g><text x="300" y="147" text-anchor="middle" font-size="24" fill="#30302b">Student 1</text><path d="M140 190 H215 V90 H265" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M335 90 H395 V190 H480" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(300 190)" fill="none" stroke="#466e7b" stroke-width="3" stroke-linecap="round"><circle cy="-12" r="11"/><path d="M-23 22 C-23-5 23-5 23 22"/></g><text x="300" y="247" text-anchor="middle" font-size="24" fill="#30302b">Student 2</text><path d="M140 190 H215 V190 H265" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M335 190 H395 V190 H480" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(300 290)" fill="none" stroke="#466e7b" stroke-width="3" stroke-linecap="round"><circle cy="-12" r="11"/><path d="M-23 22 C-23-5 23-5 23 22"/></g><text x="300" y="347" text-anchor="middle" font-size="24" fill="#30302b">Student 3</text><path d="M140 190 H215 V290 H265" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M335 290 H395 V190 H480" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(790 90)" fill="none" stroke="#466e7b" stroke-width="3" stroke-linecap="round"><circle cy="-12" r="11"/><path d="M-23 22 C-23-5 23-5 23 22"/></g><text x="790" y="147" text-anchor="middle" font-size="24" fill="#30302b">Student 1</text><path d="M610 190 H705 V90 H755" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M825 90 H885 V190 H950" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(790 190)" fill="none" stroke="#466e7b" stroke-width="3" stroke-linecap="round"><circle cy="-12" r="11"/><path d="M-23 22 C-23-5 23-5 23 22"/></g><text x="790" y="247" text-anchor="middle" font-size="24" fill="#30302b">Student 2</text><path d="M610 190 H705 V190 H755" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M825 190 H885 V190 H950" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(790 290)" fill="none" stroke="#466e7b" stroke-width="3" stroke-linecap="round"><circle cy="-12" r="11"/><path d="M-23 22 C-23-5 23-5 23 22"/></g><text x="790" y="347" text-anchor="middle" font-size="24" fill="#30302b">Student 3</text><path d="M610 190 H705 V290 H755" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M825 290 H885 V190 H950" fill="none" stroke="#77756d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(1020 190)" fill="none" stroke="#b37218" stroke-width="3.5"><circle r="33"/><path d="M-17 0 L-4 13 L19-15"/></g><text x="1020" y="270" text-anchor="middle" font-size="28" fill="#b37218" font-weight="700">Grading</text><text x="1020" y="307" text-anchor="middle" font-size="23" fill="#30302b">Draft + reviews</text><text x="545" y="385" text-anchor="middle" font-size="26" fill="#30302b">Revise the paper and explain how you addressed each concern.</text></g></svg>