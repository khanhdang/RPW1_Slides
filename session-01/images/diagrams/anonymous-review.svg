<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc"><title id="title">Anonymous review and conflicts</title><desc id="desc">Diagram labels: Single-anonymous. Reviewer identities hidden. Author identities visible. Double-anonymous. Reviewer identities hidden. Author identities hidden. Reviewers need relevant expertise and must disclose conflicts..</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#77756d" stroke-width="2" /></marker></defs><g font-family="Aptos, Segoe UI, Arial, sans-serif"><path d="M550 35 V340" fill="none" stroke="#c9c5b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(270 85) scale(1)" fill="none" stroke="#77756d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-22" r="16" /><path d="M-32 29 C-32-12 32-12 32 29" /></g><text x="270" y="161" fill="#77756d" font-size="31" text-anchor="middle" font-weight="700">Single-anonymous</text><text x="270" y="208" fill="#30302b" font-size="27" text-anchor="middle">Reviewer identities hidden</text><text x="270" y="248" fill="#30302b" font-size="27" text-anchor="middle">Author identities visible</text><g transform="translate(830 85) scale(1)" fill="none" stroke="#b37218" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-25-4 H25 V35 H-25 Z M-15-4 V-20 C-15-42 15-42 15-20 V-4 M0 10 V23" /></g><text x="830" y="161" fill="#b37218" font-size="31" text-anchor="middle" font-weight="700">Double-anonymous</text><text x="830" y="208" fill="#30302b" font-size="27" text-anchor="middle">Reviewer identities hidden</text><text x="830" y="248" fill="#30302b" font-size="27" text-anchor="middle">Author identities hidden</text><text x="550" y="385" fill="#466e7b" font-size="25" text-anchor="middle">Reviewers need relevant expertise 