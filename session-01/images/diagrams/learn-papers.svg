<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc"><title id="title">Learning from published papers</title><desc id="desc">Diagram labels: Problem. How does the paper motivate it?. Contribution. How do authors explain the idea?. Figures. How do they support the argument?. Conclusion. How does it connect to results?.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#77756d" stroke-width="2" /></marker></defs><g font-family="Aptos, Segoe UI, Arial, sans-serif"><path d="M170 30 H440 L475 65 V380 H170 Z" fill="none" stroke="#b37218" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M440 30 V65 H475" fill="none" stroke="#b37218" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 75.0 H420" fill="none" stroke="#466e7b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 89.0 H400" fill="none" stroke="#77756d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M490 83.0 H555" fill="none" stroke="#77756d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><text x="590" y="75.0" fill="#b37218" font-size="28" text-anchor="start" font-weight="700">Problem</text><text x="590" y="107.0" fill="#30302b" font-size="24" text-anchor="start">How does the paper motivate it?</text><path d="M205 150.0 H420" fill="none" stroke="#466e7b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 164.0 H400" fill="none" stroke="#77756d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M490 158.0 H555" fill="none" stroke="#77756d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><text x="590" y="150.0" fill="#b37218" font-size="28" text-anchor="start" font-weight="700">Contribution</text><text x="590" y="182.0" fill="#30302b" font-size="24" text-anchor="start">How do authors explain the idea?</text><path d="M205 225.0 H420" fill="none" stroke="#466e7b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 239.0 H400" fill="none" stroke="#77756d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M490 233.0 H555" fill="none" stroke="#77756d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><text x="590" y="225.0" fill="#b37218" font-size="28" text-anchor="start" font-weight="700">Figures</text><text x="590" y="257.0" fill="#30302b" font-size="24" text-anchor="start">How do they support the argument?</text><path d="M205 300.0 H420" fill="none" stroke="#466e7b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 314.0 H400" fill="none" stroke="#77756d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M490 308.0 H555" fill="none" stroke="#77756d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><text x="590" y="300.0" fill="#b37218" font-size="28" text-anchor="start" font-weight="700">Conclusion</text><text x="590" y="332.0" fill="#30302b" font-size="24" text-anchor="start">How does it connect to results?</text></g></svg>