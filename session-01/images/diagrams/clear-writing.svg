<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc"><title id="title">Clear scientific writing</title><desc id="desc">Diagram labels: Question. State the problem. Explanation. Use familiar words. Evidence. Show what supports it. Reader. Can they follow it?.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#77756d" stroke-width="2" /></marker></defs><g font-family="Aptos, Segoe UI, Arial, sans-serif"><g transform="translate(140.0 137) scale(1)" fill="none" stroke="#b37218" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="34" /><path d="M-11-13 C-11-28 14-27 14-11 C14-1 0-3 0 10 M0 22 V23" /></g><text x="140.0" y="223" fill="#30302b" font-size="27" text-anchor="middle" font-weight="700">Question</text><text x="140.0" y="264" fill="#30302b" font-size="23" text-anchor="middle">State the problem</text><path d="M195.0 137 H358.3333333333333" fill="none" stroke="#77756d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><g transform="translate(413.3333333333333 137) scale(1)" fill="none" stroke="#466e7b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-35-26 H35 V22 H-6 L-26 37 V22 H-35 Z M-21-9 H21 M-21 7 H11" /></g><text x="413.3333333333333" y="223" fill="#30302b" font-size="27" text-anchor="middle" font-weight="700">Explanation</text><text x="413.3333333333333" y="264" fill="#30302b" font-size="23" text-anchor="middle">Use familiar words</text><path d="M468.3333333333333 137 H631.6666666666666" fill="none" stroke="#77756d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><g transform="translate(686.6666666666666 137) scale(1)" fill="none" stroke="#b37218" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-35