<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title>Desk rejection for a missing literature review</title><desc>A missing literature review can prevent assessment of context and contribution and may lead to desk rejection. The author should survey, synthesize, and revise.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#665747"/></marker></defs><style>text{font-family:Aptos,Segoe UI,Arial,sans-serif;fill:#342b23;font-size:25px} .label{font-size:21px;fill:#665747} .line{fill:none;stroke:#665747;stroke-width:3;marker-end:url(#arrow)}</style><rect x="20" y="150" width="240" height="120" rx="12" fill="#f5e2de" stroke="#bd7466" stroke-width="2"/><text x="140.0" y="202.0" text-anchor="middle">Manuscript lacks</text><text x="140.0" y="234.0" text-anchor="middle">literature review</text><rect x="335" y="150" width="280" height="120" rx="12" fill="#eee4d4" stroke="#9b805f" stroke-width="2"/><text x="475.0" y="202.0" text-anchor="middle">Editor cannot assess</text><text x="475.0" y="234.0" text-anchor="middle">context or contribution</text><rect x="710" y="150" width="365" height="120" rx="12" fill="#f5e2de" stroke="#bd7466" stroke-width="2"/><text x="892.5" y="202.0" text-anchor="middle">Possible desk rejection</text><text x="892.5" y="234.0" text-anchor="middle">Before peer review</text><path class="line" d="M260 210H335"/><path class="line" d="M615 210H710"/><rect x="335" y="345" width="540" height="80" rx="12" fill="#e1eee8" stroke="#5b8e79" stroke-width="2"/><text x="605.0" y="393.0" text-anchor="middle">Survey, synthesize, and revise</text><path class="line" d="M895 270V315H605V345"/><text class="label" x="990" y="317" text-anchor="middle">Next step</text></svg>