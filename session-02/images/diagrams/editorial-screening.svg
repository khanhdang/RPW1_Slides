<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title>Literature review and editorial screening</title><desc>A submitted manuscript undergoes editorial screening of scope and prior work. Screening may lead to peer review or return or desk rejection.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#665747"/></marker></defs><style>text{font-family:Aptos,Segoe UI,Arial,sans-serif;fill:#342b23;font-size:25px} .label{font-size:21px;fill:#665747} .line{fill:none;stroke:#665747;stroke-width:3;marker-end:url(#arrow)}</style><rect x="20" y="155" width="235" height="120" rx="12" fill="#eee4d4" stroke="#9b805f" stroke-width="2"/><text x="137.5" y="207.0" text-anchor="middle">Submitted</text><text x="137.5" y="239.0" text-anchor="middle">manuscript</text><rect x="345" y="155" width="320" height="120" rx="12" fill="#eee4d4" stroke="#9b805f" stroke-width="2"/><text x="505.0" y="207.0" text-anchor="middle">Editorial screening</text><text x="505.0" y="239.0" text-anchor="middle">Scope and prior work</text><rect x="775" y="50" width="300" height="110" rx="12" fill="#e1eee8" stroke="#5b8e79" stroke-width="2"/><text x="925.0" y="97.0" text-anchor="middle">Proceed to</text><text x="925.0" y="129.0" text-anchor="middle">peer review</text><rect x="775" y="290" width="300" height="110" rx="12" fill="#f5e2de" stroke="#bd7466" stroke-width="2"/><text x="925.0" y="337.0" text-anchor="middle">Return or</text><text x="925.0" y="369.0" text-anchor="middle">desk reject</text><path class="line" d="M255 215H345"/><path class="line" d="M665 215H715V105H775"/><path class="line" d="M715 215V345H775"/><text class="label" x="895" y="32" text-anchor="middle">Meets screening criteria</text><text class="label" x="900" y="275" text-anchor="middle">Major concerns</text></svg>